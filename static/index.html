<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Debugger Agent</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0a0a0a;
      --border: #262626;
      --border-hover: #404040;
      --text: #ffffff;
      --text-muted: #888888;
      --text-dim: #525252;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 2rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    .link-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      padding: 0.3rem 0.65rem;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .link-btn:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    /* Minimal Task Navigation Tabs */
    .task-switcher {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      margin-bottom: 1.75rem;
      background: var(--card-bg);
    }

    .task-segment {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }

    .task-segment:hover:not(.active) {
      color: var(--text);
    }

    .task-segment.active {
      background: #171717;
      color: #ffffff;
      border: 1px solid var(--border);
    }

    .badge-tag {
      font-size: 0.68rem;
      padding: 0.05rem 0.35rem;
      border-radius: 3px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* Layout Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 1.5rem;
    }

    @media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
    }

    .objective-text {
      font-size: 0.88rem;
      color: #d4d4d4;
      line-height: 1.5;
    }

    .broken-code-box {
      background: #000000;
      border: 1px solid var(--border);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      margin-top: 0.5rem;
    }

    /* Minimal Table Listing */
    .table-row {
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.5rem;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 0.3rem;
    }

    .cols-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .col-pill {
      background: #171717;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.08rem 0.35rem;
      border-radius: 3px;
    }

    /* SQL Console */
    textarea.editor {
      width: 100%;
      height: 110px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #ffffff;
      outline: none;
      resize: vertical;
      margin-bottom: 0.75rem;
    }

    textarea.editor:focus {
      border-color: var(--border-hover);
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .btn-exec {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      padding: 0.45rem 1rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-exec:hover {
      background: #e5e5e5;
    }

    .action-links {
      display: flex;
      gap: 1rem;
      font-size: 0.78rem;
    }

    .action-link {
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .action-link:hover { color: var(--text); }

    /* Minimal Progress Bar */
    .reward-box {
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem 0.85rem;
      margin-bottom: 1.25rem;
    }

    .reward-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .score-display {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #262626;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .progress-fill {
      height: 100%;
      width: 5%;
      background: #ffffff;
      transition: width 0.25s ease;
    }

    .reward-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .log-box {
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.65rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      height: 140px;
      overflow-y: auto;
    }

    .log-item {
      margin-bottom: 0.35rem;
      color: #a3a3a3;
      white-space: pre-wrap;
      border-bottom: 1px solid #171717;
      padding-bottom: 0.25rem;
    }

    .log-time { color: var(--text-dim); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <div class="brand-title">SQL Debugger Agent</div>
      <div class="brand-sub">OpenEnv Benchmark & Environment</div>
    </div>
    <div class="header-right">
      <div class="status-indicator"><div class="dot"></div> Ready</div>
      <a href="/docs" target="_blank" class="link-btn">API Specs (/docs)</a>
    </div>
  </header>

  <!-- Segmented Navigation -->
  <div class="task-switcher">
    <button class="task-segment active" id="tab-task-0" onclick="switchTask('task-0')">
      <span>1. Syntax Debugger</span>
      <span class="badge-tag">Easy</span>
    </button>
    <button class="task-segment" id="tab-task-1" onclick="switchTask('task-1')">
      <span>2. Performance Tuner</span>
      <span class="badge-tag">Medium</span>
    </button>
    <button class="task-segment" id="tab-task-2" onclick="switchTask('task-2')">
      <span>3. Schema Architect</span>
      <span class="badge-tag">Hard</span>
    </button>
    <button class="task-segment" id="tab-custom-db" onclick="connectRealDb()">
      <span>4. Real Database Mode</span>
      <span class="badge-tag">Disk .db</span>
    </button>
  </div>

  <!-- Grid -->
  <div class="grid">

    <!-- Left Column -->
    <div>
      <div class="card">
        <div class="card-label">Task Objective</div>
        <div class="objective-text" id="taskDesc">Loading details...</div>
        <div id="brokenBox" style="display: none;">
          <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.4rem; font-weight: 600;">BROKEN QUERY:</div>
          <div class="broken-code-box" id="brokenSql"></div>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <div class="card-label" style="margin-bottom: 0;">Database Tables</div>
          <span class="action-link" style="font-size: 0.72rem;" onclick="refreshState()">Sync</span>
        </div>
        <div id="tableList">
          <div style="font-size: 0.78rem; color: var(--text-muted);">Loading tables...</div>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div>
      <div class="card">
        <div class="card-label" style="display: flex; justify-content: space-between;">
          <span>SQL Console</span>
          <span class="action-link" onclick="loadPreset()">Auto-Fill Solution</span>
        </div>

        <textarea class="editor" id="sqlInput" placeholder="Enter SQL statement..."></textarea>

        <div class="action-row">
          <button class="btn-exec" onclick="runSql()">Execute SQL</button>
          <div class="action-links">
            <span class="action-link" onclick="autoSolve()">Auto-Solve</span>
            <span class="action-link" onclick="resetTask()">Reset</span>
          </div>
        </div>

        <div class="reward-box">
          <div class="reward-top">
            <span style="font-size: 0.75rem; color: var(--text-muted);">Reward Score</span>
            <span class="score-display" id="scoreVal">0.05</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="reward-desc" id="scoreReason">Task initialized.</div>
        </div>

        <div class="card-label">Activity Log</div>
        <div class="log-box" id="logBox"></div>
      </div>
    </div>

  </div>

  <script>
    let currentTask = 'task-0';
    let syncInterval = null;

    const PRESETS = {
      'task-0': "SELECT * FROM users WHERE name = 'John Doe' AND email = 'john@example.com'",
      'task-1': "CREATE INDEX idx_orders_customer ON orders(customer_id)",
      'task-2': "CREATE TABLE managers (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, email TEXT);\nINSERT INTO managers (name, email) SELECT DISTINCT manager_name, manager_email FROM projects;\nCREATE TABLE projects_new (id INTEGER PRIMARY KEY, project_name TEXT, manager_id INTEGER REFERENCES managers(id));\nINSERT INTO projects_new (project_name, manager_id) SELECT p.project_name, m.id FROM projects p JOIN managers m ON p.manager_name = m.name;\nDROP TABLE projects;\nALTER TABLE projects_new RENAME TO projects;"
    };

    async function init() {
      await resetTask();
      if (!syncInterval) {
        syncInterval = setInterval(refreshState, 2500);
      }
    }

    async function switchTask(taskId) {
      currentTask = taskId;
      setActiveSegment(`tab-${taskId}`);
      await resetTask();
    }

    function setActiveSegment(tabId) {
      document.querySelectorAll('.task-segment').forEach(s => s.classList.remove('active'));
      const el = document.getElementById(tabId);
      if (el) el.classList.add('active');
    }

    async function connectRealDb() {
      currentTask = 'custom-db';
      setActiveSegment('tab-custom-db');
      const path = prompt("Enter SQLite database file path:", "real_production.db") || "real_production.db";

      const res = await fetch('/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ db_path: path })
      });
      const obs = await res.json();

      document.getElementById('taskDesc').innerText = obs.task_description;
      document.getElementById('brokenBox').style.display = 'none';
      renderTables(obs.schema_metadata || []);
      updateScore(0.95, `Connected to live database (${path}).`);
      addLog(`Connected to database: ${path}`);
    }

    async function resetTask() {
      if (currentTask === 'custom-db') return;

      const res = await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_id: currentTask })
      });
      const obs = await res.json();

      document.getElementById('taskDesc').innerText = obs.task_description;

      const bBox = document.getElementById('brokenBox');
      if (obs.broken_query) {
        bBox.style.display = 'block';
        document.getElementById('brokenSql').innerText = obs.broken_query;
      } else {
        bBox.style.display = 'none';
      }

      renderTables(obs.schema_metadata || []);
      updateScore(0.05, "Environment reset.");
      loadPreset();
      addLog(`Task ${currentTask} initialized.`);
    }

    function renderTables(tables) {
      const container = document.getElementById('tableList');
      if (!tables || !tables.length) {
        container.innerHTML = '<div style="font-size: 0.78rem; color: var(--text-muted);">No active tables.</div>';
        return;
      }
      container.innerHTML = tables.map(tbl => `
        <div class="table-row">
          <div class="table-header">
            <span>${tbl.table_name}</span>
            <span style="font-size: 0.7rem; color: var(--text-muted);">${tbl.row_count} rows</span>
          </div>
          <div class="cols-wrapper">
            ${tbl.columns.map(c => `<span class="col-pill">${c}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function loadPreset() {
      document.getElementById('sqlInput').value = PRESETS[currentTask] || '';
    }

    async function runSql() {
      const sql = document.getElementById('sqlInput').value.trim();
      if (!sql) return;

      const res = await fetch('/step', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action_type: 'execute_sql', params: { sql } })
      });
      const data = await res.json();

      updateScore(data.reward.value, data.reward.reason);
      if (data.observation.schema_metadata) {
        renderTables(data.observation.schema_metadata);
      }
      addLog(data.observation.last_action_result || 'Action completed.');
    }

    function updateScore(val, reason) {
      document.getElementById('scoreVal').innerText = val.toFixed(2);
      const pct = Math.min(Math.max((val / 0.95) * 100, 5), 100);
      document.getElementById('progressFill').style.width = `${pct}%`;
      document.getElementById('scoreReason').innerText = reason || '';
    }

    function addLog(text) {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerText = `[${time}] ${text}`;
      box.prepend(div);
    }

    async function refreshState() {
      try {
        const res = await fetch('/state');
        const obs = await res.json();
        if (obs.schema_metadata) {
          renderTables(obs.schema_metadata);
        }
      } catch (e) {}
    }

    async function autoSolve() {
      await resetTask();
      let sqls = [];
      if (currentTask === 'task-0') {
        sqls = ["SELECT * FROM users WHERE name = 'John Doe' AND email = 'john@example.com'"];
      } else if (currentTask === 'task-1') {
        sqls = ["CREATE INDEX idx_orders_customer ON orders(customer_id)"];
      } else if (currentTask === 'task-2') {
        sqls = [
          "CREATE TABLE managers (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, email TEXT)",
          "INSERT INTO managers (name, email) SELECT DISTINCT manager_name, manager_email FROM projects",
          "CREATE TABLE projects_new (id INTEGER PRIMARY KEY, project_name TEXT, manager_id INTEGER REFERENCES managers(id))",
          "INSERT INTO projects_new (project_name, manager_id) SELECT p.project_name, m.id FROM projects p JOIN managers m ON p.manager_name = m.name",
          "DROP TABLE projects",
          "ALTER TABLE projects_new RENAME TO projects"
        ];
      }

      for (let sql of sqls) {
        document.getElementById('sqlInput').value = sql;
        await new Promise(r => setTimeout(r, 500));
        await runSql();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
